name: Experimental VST3 CI

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/vst3.yml
      - CMakeLists.txt
      - cmake/**
      - include/rhodes/**
      - src/**
      - plugins/vst3/**
      - tests/cpp/**
      - docs/DEPENDENCIES.md
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vst3-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  vst3:
    name: VST3 prototype / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            configure_args: '-G "Unix Makefiles"'
          - os: windows-latest
            configure_args: '-A x64'
          - os: macos-latest
            # Use the native architecture and a non-Xcode generator. This avoids
            # the SDK's Xcode-only fast-math flags and signing-team requirement.
            configure_args: '-G "Unix Makefiles" -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out project
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: source
          persist-credentials: false
      - name: Check out the pinned official SDK
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: steinbergmedia/vst3sdk
          ref: 3cdf9ca5d1f5b1b21e0a86832aa4abe55607bd96
          path: vst3sdk
          persist-credentials: false
          submodules: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Initialize only the four headless SDK dependencies
        run: git -C vst3sdk submodule update --init --depth 1 base cmake pluginterfaces public.sdk
      - name: Verify the SDK and every required submodule revision
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess

          sdk = Path('vst3sdk')
          expected = {
              '.': '3cdf9ca5d1f5b1b21e0a86832aa4abe55607bd96',
              'base': 'fcf9da0bd27a16f7f03773a3a39822f28f5c8477',
              'cmake': '054c9143cbb8d47fc4694e473f2ee3b4d951a8f5',
              'pluginterfaces': '4f547e8e102b47de4a8b8aaf343c73b700786372',
              'public.sdk': '586dc5e6c8012c3e4b01c79389375cbe96bdb1da',
          }
          for relative, revision in expected.items():
              actual = subprocess.check_output(
                  ['git', '-C', str(sdk / relative), 'rev-parse', 'HEAD'], text=True
              ).strip()
              if actual != revision:
                  raise SystemExit(f'SDK revision mismatch for {relative}: {actual}')
              print(f'{relative}: {actual}')
          PY
      - name: Configure the optional headless instrument
        run: >-
          cmake -S source -B build/vst3
          -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
          -DRHODES_BUILD_VST3=ON
          -DRHODES_VST3_SDK_ROOT="${{ github.workspace }}/vst3sdk"
          -DSMTG_ENABLE_VSTGUI_SUPPORT=OFF
          -DSMTG_ENABLE_VST3_PLUGIN_EXAMPLES=OFF
          -DSMTG_ENABLE_VST3_HOSTING_EXAMPLES=OFF
          -DSMTG_CREATE_PLUGIN_LINK=OFF
          ${{ matrix.configure_args }}
      - name: Build the actual module and retained host tests
        run: >-
          cmake --build build/vst3 --config Release
          --target rhodes_vst3 rhodes_vst3_host_tests rhodes_vst3_fp_tests --parallel 2
      - name: Run retained host tests and the official SDK validator
        run: >-
          ctest --test-dir build/vst3 -C Release -R '^vst3\.'
          --output-on-failure --no-tests=error
