name: Experimental VST3 CI

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/vst3.yml
      - CMakeLists.txt
      - cmake/**
      - include/rhodes/**
      - src/**
      - plugins/vst3/**
      - apps/vst3_benchmark.cpp
      - tests/cpp/**
      - tools/capture_ci_diagnostics.py
      - tools/compare_vst3_legacy.py
      - docs/DEPENDENCIES.md
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Keep explicitly requested verification independent of push supersession.
  group: vst3-${{ github.workflow }}-${{ github.ref }}-${{ (github.event_name == 'workflow_dispatch' || github.run_attempt > 1) && github.run_id || 'automatic' }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' && github.run_attempt == 1 }}

jobs:
  vst3:
    name: VST3 prototype / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            configure_args: '-G "Unix Makefiles"'
          - os: windows-latest
            configure_args: '-A x64'
          - os: macos-latest
            # Use the native architecture and a non-Xcode generator. This avoids
            # the SDK's Xcode-only fast-math flags and signing-team requirement.
            configure_args: '-G "Unix Makefiles" -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0'
    runs-on: ${{ matrix.os }}
    # Two native module builds plus the complete legacy-capture matrix.
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out project
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: source
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Check out the fixed same-repository legacy source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository }}
          ref: 6c91dab00855b67a559e92edb79ae49e567be469
          path: legacy-source
          persist-credentials: false
      - name: Check out the pinned official SDK
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: steinbergmedia/vst3sdk
          ref: 3cdf9ca5d1f5b1b21e0a86832aa4abe55607bd96
          path: vst3sdk
          persist-credentials: false
          submodules: false
      - name: Initialize only the four headless SDK dependencies
        run: >-
          python source/tools/capture_ci_diagnostics.py run --output-dir ci-evidence
          --label sdk-initialize --
          git -C vst3sdk submodule update --init --depth 1 base cmake pluginterfaces public.sdk
      - name: Verify and retain source, SDK and all required submodule revisions
        run: >-
          python source/tools/capture_ci_diagnostics.py metadata --phase before
          --source-root source --expected-sha ${{ github.sha }} --output-dir ci-evidence
          --baseline-source legacy-source --sdk-root vst3sdk
      - name: Configure the fixed legacy modules with the same native toolchain
        run: >-
          python source/tools/capture_ci_diagnostics.py run --output-dir ci-evidence
          --label legacy-configure -- cmake -S legacy-source -B legacy-build
          -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF
          -DRHODES_BUILD_VST3=ON
          -DRHODES_VST3_SDK_ROOT="${{ github.workspace }}/vst3sdk"
          -DSMTG_ENABLE_VSTGUI_SUPPORT=OFF
          -DSMTG_ENABLE_VST3_PLUGIN_EXAMPLES=OFF
          -DSMTG_ENABLE_VST3_HOSTING_EXAMPLES=OFF
          -DSMTG_CREATE_PLUGIN_LINK=OFF
          ${{ matrix.configure_args }}
      - name: Build only the three fixed legacy module targets
        run: >-
          python source/tools/capture_ci_diagnostics.py run --output-dir ci-evidence
          --label legacy-build -- cmake --build legacy-build --config Release
          --target rhodes_vst3 rhodes_vst3_filtered rhodes_vst3_quadrature --parallel 2
      - name: Bind each baseline native module to its source and SHA-256
        run: >-
          python source/tools/capture_ci_diagnostics.py baseline-manifest
          --source-root legacy-source --bundle-root legacy-build/VST3/Release
          --build-dir legacy-build --sdk-root vst3sdk --output-dir ci-evidence
      - name: Configure the optional headless instrument
        run: >-
          python source/tools/capture_ci_diagnostics.py run --output-dir ci-evidence
          --label configure -- cmake -S source -B build/vst3
          -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
          -DRHODES_BUILD_VST3=ON
          -DRHODES_VST3_SDK_ROOT="${{ github.workspace }}/vst3sdk"
          -DRHODES_VST3_LEGACY_BUNDLE_ROOT="${{ github.workspace }}/legacy-build/VST3/Release"
          -DSMTG_ENABLE_VSTGUI_SUPPORT=OFF
          -DSMTG_ENABLE_VST3_PLUGIN_EXAMPLES=OFF
          -DSMTG_ENABLE_VST3_HOSTING_EXAMPLES=OFF
          -DSMTG_CREATE_PLUGIN_LINK=OFF
          ${{ matrix.configure_args }}
      - name: Require identical baseline and candidate compilers and generators
        run: >-
          python source/tools/capture_ci_diagnostics.py verify-toolchains
          --baseline-build legacy-build --current-build build/vst3 --output-dir ci-evidence
      - name: Build all three actual modules and retained host tests
        run: >-
          python source/tools/capture_ci_diagnostics.py run --output-dir ci-evidence
          --label build -- cmake --build build/vst3 --config Release
          --target rhodes_vst3_checks --parallel 2
      - name: Run host tests, legacy unity comparisons and all three SDK validators
        run: >-
          python source/tools/capture_ci_diagnostics.py ctest --output-dir ci-evidence
          --label ctest -- ctest --test-dir build/vst3 -C Release -R '^vst3\.'
          --output-on-failure --no-tests=error
      - name: Retain final source, SDK, compiler and actual module metadata
        if: always()
        env:
          CI_JOB_STATUS: ${{ job.status }}
        run: >-
          python source/tools/capture_ci_diagnostics.py metadata --phase after
          --source-root source --expected-sha ${{ github.sha }} --output-dir ci-evidence
          --baseline-source legacy-source --sdk-root vst3sdk
          --build-dir legacy-build --build-dir build/vst3
          --bundle-root legacy-build/VST3/Release --bundle-root build/vst3/VST3/Release
      - name: Archive all three validated experimental bundles
        id: vst3-archive
        env:
          VST3_BUNDLE_ROOT: build/vst3/VST3/Release
          VST3_ARTIFACT_NAME: experimental-vst3-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib
          import os
          import platform
          import stat
          import tarfile

          bundle_root = Path(os.environ['VST3_BUNDLE_ROOT'])
          artifact_name = os.environ['VST3_ARTIFACT_NAME']
          suffix = {'Linux': '.so', 'Windows': '.vst3', 'Darwin': ''}[platform.system()]
          bundles = [bundle_root / f'{name}.vst3' for name in
                     ('RhodesResearch', 'RhodesResearchFiltered',
                      'RhodesResearchQuadrature')]
          sources = {}
          for bundle in bundles:
              if not bundle.is_dir() or bundle.is_symlink():
                  raise SystemExit(f'Missing complete bundle directory: {bundle}')
              required = [bundle / 'Contents/Resources' / name for name in
                          ('LICENSE.txt', 'THIRD_PARTY_NOTICES.md', 'moduleinfo.json')]
              modules = list(bundle.glob(f'Contents/*/{bundle.stem}{suffix}'))
              if not modules:
                  raise SystemExit(f'Missing native module in {bundle}')
              for path in required + modules:
                  if not path.is_file() or path.is_symlink() or path.stat().st_size == 0:
                      raise SystemExit(f'Missing or empty bundle file: {path}')
              for path in (bundle, *bundle.rglob('*')):
                  sources[path.relative_to(bundle_root).as_posix()] = path

          archive_path = Path('build/vst3-artifacts') / f'{artifact_name}.tar.gz'
          archive_path.parent.mkdir(parents=True, exist_ok=True)
          # The inner tar preserves complete bundles, modes and symlinks inside
          # GitHub's artifact ZIP. Never upload individual module binaries.
          with tarfile.open(archive_path, 'w:gz', format=tarfile.PAX_FORMAT,
                            dereference=False) as archive:
              for bundle in bundles:
                  archive.add(bundle, arcname=bundle.name)
          with tarfile.open(archive_path, 'r:gz') as archive:
              if set(archive.getnames()) != set(sources):
                  raise SystemExit('Archive does not contain all three complete bundles')
              for name, source in sources.items():
                  member = archive.getmember(name)
                  if member.mode != stat.S_IMODE(source.lstat().st_mode):
                      raise SystemExit(f'Archive permission mismatch: {name}')
                  if source.is_symlink():
                      if not member.issym() or member.linkname != os.readlink(source):
                          raise SystemExit(f'Archive symlink mismatch: {name}')
                  elif source.is_file():
                      with archive.extractfile(member) as archived:
                          if hashlib.file_digest(archived, 'sha256').digest() != \
                                  hashlib.sha256(source.read_bytes()).digest():
                              raise SystemExit(f'Archive content mismatch: {name}')
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write(f'name={artifact_name}\npath={archive_path.as_posix()}\n')
          print(f'Verified {len(sources)} entries in {archive_path}')
          PY
      - name: Upload validated experimental bundles
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.vst3-archive.outputs.name }}
          path: ${{ steps.vst3-archive.outputs.path }}
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
      - name: Upload raw native diagnostics and legacy comparison captures
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vst3-diagnostics-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ci-evidence/
            build/vst3/Testing/Temporary/
            build/vst3/legacy-comparison/
            build/vst3/CMakeCache.txt
            build/vst3/CMakeFiles/CMakeConfigureLog.yaml
            build/vst3/CMakeFiles/CMakeOutput.log
            build/vst3/CMakeFiles/CMakeError.log
            legacy-build/VST3/Release/manifest.json
            legacy-build/CMakeCache.txt
            legacy-build/CMakeFiles/CMakeConfigureLog.yaml
            legacy-build/CMakeFiles/CMakeOutput.log
            legacy-build/CMakeFiles/CMakeError.log
          if-no-files-found: error
          retention-days: 90
