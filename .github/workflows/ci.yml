name: Foundation CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: foundation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: Project state / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Validate canonical project state
        run: python tools/project.py validate
      - name: Reject stale generated state
        run: python tools/project.py sync --check
      - name: Validate data provenance contracts
        run: python tools/validate_data.py
      - name: Check documentation integrity
        run: python tools/check_docs.py
      - name: Validate actual-agent ledger
        run: python tools/campaign.py validate --require-complete
      - name: Reject stale campaign index
        run: python tools/campaign.py sync --check
      - name: Validate development assignments and report hashes
        run: python tools/development_campaign.py validate
      - name: Reject stale development campaign index
        run: python tools/development_campaign.py sync --check
      - name: Validate continuation assignments and immutable report hashes
        run: python tools/validate_continuation_campaign.py
      - name: Reject stale audio filter coefficients
        run: python tools/generate_audio_filter.py --check
      - name: Reject stale quadrature filter coefficients
        run: python tools/generate_quadrature_filter.py --check
      - name: Check agent tooling
        run: python -m unittest discover -s tests/python -v

  cpp:
    name: C++20 / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release --parallel 2
      - name: Verify analytical and integration behavior
        run: ctest --test-dir build -C Release --output-on-failure --no-tests=error

  sanitizers:
    name: Address and undefined behavior sanitizers
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Configure
        run: cmake --preset sanitize
      - name: Build
        run: cmake --build --preset sanitize --parallel 2
      - name: Test
        run: ctest --preset sanitize --no-tests=error
