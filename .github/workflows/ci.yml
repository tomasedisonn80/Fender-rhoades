name: Foundation CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Explicit verification and retries must survive later development pushes.
  # Automatic runs still supersede older automatic runs on the same ref.
  group: foundation-${{ github.workflow }}-${{ github.ref }}-${{ (github.event_name == 'workflow_dispatch' || github.run_attempt > 1) && github.run_id || 'automatic' }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' && github.run_attempt == 1 }}

jobs:
  contracts:
    name: Project state / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - name: Bind diagnostics to the checked-out source
        run: >-
          python tools/capture_ci_diagnostics.py metadata --phase before
          --source-root . --expected-sha ${{ github.sha }} --output-dir ci-evidence
      - name: Validate canonical project state
        run: >-
          python tools/capture_ci_diagnostics.py run --output-dir ci-evidence
          --label state-validate -- python tools/project.py validate
      - name: Reject stale generated state
        run: >-
          python tools/capture_ci_diagnostics.py run --output-dir ci-evidence
          --label state-sync -- python tools/project.py sync --check
      - name: Validate data provenance contracts
        run: >-
          python tools/capture_ci_diagnostics.py run --output-dir ci-evidence
          --label data -- python tools/validate_data.py
      - name: Check documentation integrity
        run: >-
          python tools/capture_ci_diagnostics.py run --output-dir ci-evidence
          --label documentation -- python tools/check_docs.py
      - name: Validate actual-agent ledger
        run: >-
          python tools/capture_ci_diagnostics.py run --output-dir ci-evidence
          --label campaign-validate -- python tools/campaign.py validate --require-complete
      - name: Reject stale campaign index
        run: >-
          python tools/capture_ci_diagnostics.py run --output-dir ci-evidence
          --label campaign-sync -- python tools/campaign.py sync --check
      - name: Validate development assignments and report hashes
        run: >-
          python tools/capture_ci_diagnostics.py run --output-dir ci-evidence
          --label development-validate -- python tools/development_campaign.py validate
      - name: Reject stale development campaign index
        run: >-
          python tools/capture_ci_diagnostics.py run --output-dir ci-evidence
          --label development-sync -- python tools/development_campaign.py sync --check
      - name: Validate continuation assignments and immutable report hashes
        run: >-
          python tools/capture_ci_diagnostics.py run --output-dir ci-evidence
          --label continuation -- python tools/validate_continuation_campaign.py
      - name: Validate host interoperability assignments and report hashes
        run: >-
          python tools/capture_ci_diagnostics.py run --output-dir ci-evidence
          --label host-interoperability -- python tools/validate_continuation_c.py
      - name: Validate expression campaign assignments and report hashes
        run: >-
          python tools/capture_ci_diagnostics.py run --output-dir ci-evidence
          --label expression-campaign -- python tools/validate_continuation_d.py
      - name: Verify retained host MIDI raw evidence
        run: >-
          python tools/capture_ci_diagnostics.py run --output-dir ci-evidence
          --label host-midi-evidence -- python tools/verify_host_midi_archive.py
      - name: Validate quadrature assignments and immutable report hashes
        run: >-
          python tools/capture_ci_diagnostics.py run --output-dir ci-evidence
          --label quadrature-validate -- python tools/quadrature_campaign.py validate
      - name: Reject stale quadrature campaign index
        run: >-
          python tools/capture_ci_diagnostics.py run --output-dir ci-evidence
          --label quadrature-sync -- python tools/quadrature_campaign.py sync --check
      - name: Validate current development waves and report hashes
        run: >-
          python tools/capture_ci_diagnostics.py run --output-dir ci-evidence
          --label development-waves -- python tools/validate_development_waves.py --require-complete
      - name: Verify retained VST3 timing archives
        run: >-
          python tools/capture_ci_diagnostics.py run --output-dir ci-evidence
          --label vst3-timing-evidence -- python tools/verify_vst3_matrix_archive.py
          docs/validation/vst3-matrix-20261124.json
          docs/validation/vst3-matrix-batched-20261124.json
          docs/validation/vst3-matrix-batch-final-20261124.json
      - name: Reject stale audio filter coefficients
        run: >-
          python tools/capture_ci_diagnostics.py run --output-dir ci-evidence
          --label audio-filter -- python tools/generate_audio_filter.py --check
      - name: Reject stale quadrature filter coefficients
        run: >-
          python tools/capture_ci_diagnostics.py run --output-dir ci-evidence
          --label quadrature-filter -- python tools/generate_quadrature_filter.py --check
      - name: Verify independent control-text vectors
        run: >-
          python tools/capture_ci_diagnostics.py run --output-dir ci-evidence
          --label control-text -- python tools/generate_control_text_vectors.py --check
      - name: Check agent tooling
        run: >-
          python tools/capture_ci_diagnostics.py run --output-dir ci-evidence
          --label python-tests -- python -m unittest discover -s tests/python -v
      - name: Retain final source and execution metadata
        if: always()
        env:
          CI_JOB_STATUS: ${{ job.status }}
        run: >-
          python tools/capture_ci_diagnostics.py metadata --phase after
          --source-root . --expected-sha ${{ github.sha }} --output-dir ci-evidence
      - name: Upload raw contract and Python diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: foundation-${{ github.job }}-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-evidence/
          if-no-files-found: error
          retention-days: 90

  cpp:
    name: C++20 / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - name: Bind diagnostics to the checked-out source
        run: >-
          python tools/capture_ci_diagnostics.py metadata --phase before
          --source-root . --expected-sha ${{ github.sha }} --output-dir ci-evidence
      - name: Configure
        run: >-
          python tools/capture_ci_diagnostics.py run --output-dir ci-evidence
          --label configure -- cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: >-
          python tools/capture_ci_diagnostics.py run --output-dir ci-evidence
          --label build -- cmake --build build --config Release --parallel 2
      - name: Verify analytical and integration behavior
        run: >-
          python tools/capture_ci_diagnostics.py ctest --output-dir ci-evidence
          --label ctest -- ctest --test-dir build -C Release --output-on-failure --no-tests=error
      - name: Retain final source and compiler metadata
        if: always()
        env:
          CI_JOB_STATUS: ${{ job.status }}
        run: >-
          python tools/capture_ci_diagnostics.py metadata --phase after
          --source-root . --expected-sha ${{ github.sha }} --output-dir ci-evidence
          --build-dir build
      - name: Upload raw C++ diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: foundation-${{ github.job }}-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ci-evidence/
            build/Testing/Temporary/
            build/CMakeCache.txt
            build/CMakeFiles/CMakeConfigureLog.yaml
            build/CMakeFiles/CMakeOutput.log
            build/CMakeFiles/CMakeError.log
          if-no-files-found: error
          retention-days: 90

  sanitizers:
    name: Address and undefined behavior sanitizers
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - name: Bind diagnostics to the checked-out source
        run: >-
          python tools/capture_ci_diagnostics.py metadata --phase before
          --source-root . --expected-sha ${{ github.sha }} --output-dir ci-evidence
      - name: Configure
        run: >-
          python tools/capture_ci_diagnostics.py run --output-dir ci-evidence
          --label configure -- cmake --preset sanitize
      - name: Build
        run: >-
          python tools/capture_ci_diagnostics.py run --output-dir ci-evidence
          --label build -- cmake --build --preset sanitize --parallel 2
      - name: Test
        run: >-
          python tools/capture_ci_diagnostics.py ctest --output-dir ci-evidence
          --label ctest -- ctest --preset sanitize --no-tests=error
      - name: Retain final source and compiler metadata
        if: always()
        env:
          CI_JOB_STATUS: ${{ job.status }}
        run: >-
          python tools/capture_ci_diagnostics.py metadata --phase after
          --source-root . --expected-sha ${{ github.sha }} --output-dir ci-evidence
          --build-dir build/sanitize
      - name: Upload raw sanitizer diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: foundation-${{ github.job }}-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ci-evidence/
            build/sanitize/Testing/Temporary/
            build/sanitize/CMakeCache.txt
            build/sanitize/CMakeFiles/CMakeConfigureLog.yaml
            build/sanitize/CMakeFiles/CMakeOutput.log
            build/sanitize/CMakeFiles/CMakeError.log
          if-no-files-found: error
          retention-days: 90
